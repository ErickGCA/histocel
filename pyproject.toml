[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "histocel"
version = "0.1.0.dev0"
description = "Segment, classify and count cells in microscopy slide images, with your own data."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ErickGCA" }]
keywords = ["histology", "microscopy", "instance-segmentation", "cell-counting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "shapely>=2.0",
    "typer>=0.12",
]

[project.scripts]
histocel = "histocel.cli:app"

[project.urls]
Repository = "https://github.com/ErickGCA/histocel"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/histocel"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: typer declares CLI options as function-call defaults by design.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
